name: PhotoCraft Own QA
on:
  push:
    branches: [own-main]
    paths: ['own/**', 'apps/photocraft/**', 'crates/ui-egui/**', '.github/workflows/own-*.yml']
  pull_request:
    branches: [own-main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref: {type: string, required: true}
      version: {type: string, required: true}
permissions: {contents: read}
concurrency:
  group: own-qa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24', package-manager-cache: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt,clippy'}
      - uses: Swatinem/rust-cache@v2
        with: {key: 'own-${{ runner.os }}', cache-on-failure: true}
      - run: npm ci --prefix own
      - run: npm run check --prefix own && npm test --prefix own
      - run: cargo fmt --all -- --check
      - run: cargo xtask layers
      - name: Native tests
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --release --locked -p photocraft -p photocraft-ui-egui --lib --tests --features heif,photocraft/own --target ${{ matrix.target }}
      - run: cargo clippy --locked -p photocraft -p photocraft-ui-egui --all-targets --features heif,photocraft/own -- -D warnings
      - name: Build and verify native distribution
        env: {PHOTOCRAFT_RELEASE_VERSION: '${{ inputs.version }}'}
        run: node own/ci/build.mjs
      - name: Runtime, MCP, installation and package QA
        run: |
          manifest=$(find own/out -name manifest.json -print -quit)
          PHOTOCRAFT_TEST_MANIFEST="$PWD/$manifest" npm test --prefix own
          node own/ci/smoke.mjs "$manifest"
          node own/ci/pack-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: |
            own/out/**/manifest.json
            own/out/**/*.tgz
          retention-days: 14
